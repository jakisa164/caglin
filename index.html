<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Općina Čaglin</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: linear-gradient(135deg, #1e1e2f, #2a2a40);
  color: white;
}

/* HEADER */
header {
  background: linear-gradient(135deg, #1f5f3a, #144d2a);
  text-align: center;
  padding: 60px 20px;
}

header h1 {
  font-size: 40px;
}

/* TAB BUTTONS */
.tabs {
  display: flex;
  justify-content: center;
  background: #123d26;
}

.tabs button {
  background: none;
  border: none;
  color: white;
  padding: 15px 25px;
  cursor: pointer;
  font-size: 16px;
  transition: 0.3s;
}

.tabs button:hover {
  background: rgba(255,255,255,0.1);
}

.tabs button.active {
  border-bottom: 3px solid #00ff88;
}

/* CONTENT */
.container {
  max-width: 1200px;
  margin: auto;
  padding: 20px;
}

.tab-content {
  display: none;
}

.tab-content.active {
  display: block;
}

/* CARD */
.card {
  background: rgba(255,255,255,0.08);
  padding: 25px;
  border-radius: 15px;
  margin-bottom: 20px;
  backdrop-filter: blur(10px);
}

/* GRID */
.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
}

/* IMAGE GRID */
.images {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}

.images img {
  width: 100%;
  border-radius: 10px;
}

/* VIDEO */
iframe {
  width: 100%;
  height: 300px;
  border-radius: 10px;
}

/* FOOTER */
footer {
  text-align: center;
  padding: 20px;
  background: #123d26;
}
</style>

</head>
<body>

<header>
  <h1>Općina Čaglin</h1>
  <p>Klikni tab i mijenjaj sadržaj 👇</p>
</header>

<div class="tabs">
  <button class="tab-btn active" onclick="openTab('opcina')">O Čaglinu</button>
  <button class="tab-btn" onclick="openTab('priroda')">Priroda</button>
  <button class="tab-btn" onclick="openTab('slike')">Slike</button>
  <button class="tab-btn" onclick="openTab('video')">Video</button>
</div>

<div class="container">

  <!-- OPĆINA -->
  <div id="opcina" class="tab-content active">
    <div class="card">
      <h2>O općini Čaglin</h2>
      <p>Čaglin je mirna općina u Slavoniji poznata po prirodi i poljoprivredi.</p>
    </div>
  </div>

  <!-- PRIRODA -->
  <div id="priroda" class="tab-content">
    <div class="grid">
      <div class="card">
        <h3>🌲 Šume</h3>
        <p>Guste i zelene šume.</p>
      </div>
      <div class="card">
        <h3>🦌 Životinje</h3>
        <p>Srne, ptice i razne vrste.</p>
      </div>
    </div>
  </div>

  <!-- SLIKE -->
  <div id="slike" class="tab-content">
    <div class="images">
      <img src="https://source.unsplash.com/300x200/?forest">
      <img src="https://source.unsplash.com/300x200/?village">
      <img src="https://source.unsplash.com/300x200/?nature">
    </div>
  </div>

  <!-- VIDEO -->
  <div id="video" class="tab-content">
    <iframe src="https://www.youtube.com/embed/tgbNymZ7vqY"></iframe>
  </div>

</div>

<footer>
  © Školski projekt
</footer>

<script>
function openTab(tabName) {
  let tabs = document.querySelectorAll(".tab-content");
  let buttons = document.querySelectorAll(".tab-btn");

  tabs.forEach(tab => tab.classList.remove("active"));
  buttons.forEach(btn => btn.classList.remove("active"));

  document.getElementById(tabName).classList.add("active");

  event.target.classList.add("active");
}
</script>

</body>
</html>
