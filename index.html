<!-- UBACI OVO U <head> -->

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>

/* PLAVA TEMA */

body{
background:#020817;
font-family:'Poppins',sans-serif;
color:white;
overflow-x:hidden;
}

/* HERO */

.hero{
height:100vh;
background:
linear-gradient(rgba(0,0,0,0.55),rgba(0,0,0,0.82)),
url('https://images.unsplash.com/photo-1441974231531-c6227db76b6e?q=80&w=1600&auto=format&fit=crop')
center/cover no-repeat;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
}

/* NORMALAN NASLOV */

.hero h1{
font-size:7rem;
color:white;
font-family:'Cinzel',serif;
letter-spacing:5px;
text-shadow:0 0 30px rgba(255,255,255,0.25);
}

/* PLAVA SLOVA */

.intro-title,
.creator,
.card h3,
.section-title{
color:#4da6ff;
}

/* GALERIJA */

.gallery{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
gap:20px;
}

.gallery img{
width:100%;
height:240px;
object-fit:cover;
border-radius:18px;
transition:0.4s;
}

.gallery img:hover{
transform:scale(1.04);
}

/* KARTICE */

.card{
background:rgba(255,255,255,0.04);
border:1px solid rgba(255,255,255,0.08);
padding:30px;
border-radius:20px;
backdrop-filter:blur(12px);
transition:0.4s;
}

.card:hover{
box-shadow:0 0 25px rgba(77,166,255,0.4);
transform:translateY(-8px);
}

/* MAPA */

#map{
height:600px;
width:100%;
border-radius:25px;
overflow:hidden;
margin-top:40px;
border:2px solid rgba(255,255,255,0.08);
box-shadow:0 0 30px rgba(77,166,255,0.25);
}

/* FOOTER */

footer{
padding:40px;
text-align:center;
background:black;
margin-top:50px;
}

/* MAČKA */

.cat{
position:fixed;
right:15px;
bottom:15px;
width:130px;
z-index:99999;
}

</style>
